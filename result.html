<!DOCTYPE html>
<html>
<head>
    <title>Attendance Result</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f5f5f5;
            padding-top: 100px;
        }

        .card {
            display: inline-block;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h2 {
            color: green;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>✅ Attendance Marked</h2>

        <p><b>Name:</b> {{ name }}</p>
        <p><b>Roll No:</b> {{ roll }}</p>
        <p><b>Date:</b> {{ date }}</p>
        <p><b>Time:</b> {{ time }}</p>

        <p style="color:green;"><b>Status: Present</b></p>
    </div>

</body>
</html>
