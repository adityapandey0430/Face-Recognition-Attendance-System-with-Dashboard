<!DOCTYPE html>
<html>
<head>
    <title>AI Attendance System</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        button {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(45deg, #00c853, #64dd17);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        #userSection {
            display: none;
            margin-top: 20px;
        }

        #video {
            margin-top: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>🎓 AI Face Attendance System</h1>

    <!-- Start Button -->
    <button id="startBtn" onclick="showInput()">Start</button>

    <!-- User Input Section -->
    <div id="userSection">
        <input type="text" id="userid" placeholder="Enter User ID">
        <br><br>
        <button onclick="startCamera()">Submit</button>
    </div>

    <!-- Camera -->
    <img id="video" width="600">

    <script>
        function showInput() {
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("userSection").style.display = "block";
        }

        function startCamera() {
            let userId = document.getElementById("userid").value;

            if(userId === "") {
                alert("Enter User ID!");
                return;
            }

            document.getElementById("video").src = "/video?user=" + userId;
        }

        // 🔥 AUTO REDIRECT CHECK
        setInterval(function(){
            fetch('/check')
            .then(res => {
                if(res.redirected){
                    window.location.href = res.url;
                }
            });
        }, 1000);
    </script>

</body>
</html>
